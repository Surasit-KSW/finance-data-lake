# data_paths.yaml
# ================
# Canonical data path registry for Finance Data Lake
# Source of truth for all projects — never hardcode paths elsewhere
#
# Usage in Python:
#   from scripts.utils.lake_config import LakeConfig
#   cfg = LakeConfig()
#   tb_file = cfg.bronze.templates / "AMC_Q12026_Leadsheet STAT to client.xlsx"
#
# Usage in Node.js / TypeScript:
#   Fetch from API: GET /api/v1/health → includes data_lake_root

data_lake_root: "D:/_Work_Workspace/03_Data_Projects/_Finance_Data_Lake"

# ---------------------------------------------------------------------------
# LAYER RULES (Architecture — see Standards/data-lake-organization.md)
# ---------------------------------------------------------------------------
#   Bronze  → Read-only SAP exports. ETL scripts read here. API must NOT read directly.
#   Silver  → Cleaned Parquet from ETL. API queries via DuckDB views. Not in git.
#   Gold    → Pre-aggregated KPIs. API reads directly. Not in git.
#   API     → Must only read Silver/Gold (never Bronze).
#   Scripts → 06_Scripts/audit|reporting|leadsheet reads Silver/Gold, outputs to 04_Reports/
#   Workspace → 07_Workspace/ reads Silver/Gold + Bronze/PRD_GI, outputs to Google Sheets.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Bronze Layer — Raw SAP exports (Excel/CSV, never modified)
# Domain-based 6-company structure: {domain}/{company}/{plant?}/{year}/
# Source of truth for paths → company_registry.yaml (per-company breakdown)
# ---------------------------------------------------------------------------
bronze:
  root:             "01_Bronze_Raw"

  # Domain roots — each has {company}/ subfolders (amc, ga, stc, amce, amsb, psm)
  gl:               "01_Bronze_Raw/gl"               # FBL3N  gl/{company}/{year}/
  sales:            "01_Bronze_Raw/sales"             # VF05   sales/{company}/{year}/
  tb_snapshots:     "01_Bronze_Raw/tb_snapshots"      # F.01   tb_snapshots/{company}/{year}/
  warehouse_stock:  "01_Bronze_Raw/warehouse_stock"   # MB52   warehouse_stock/{company}/{year}/
  production_orders:"01_Bronze_Raw/production_orders" # PRD    production_orders/{company}/{plant}/{year}/
  cost_center:      "01_Bronze_Raw/cost_center"       # KSB1   cost_center/{company}/{plant}/{year}/
  material_docs:    "01_Bronze_Raw/material_docs"     # MB51   material_docs/{company}/{plant}/{year}/
  ar:               "01_Bronze_Raw/ar"                # FBL5N  ar/{company}/
  ap:               "01_Bronze_Raw/ap"                # AP     ap/{company}/
  inventory:        "01_Bronze_Raw/inventory"         # NRV+rollstock  inventory/{company}/
  month_end:        "01_Bronze_Raw/month_end"         # CO closing     month_end/{company}/{plant}/{year}/
  fixed_assets:     "01_Bronze_Raw/fixed_assets"      # PPE    fixed_assets/{company}/
  master_data:      "01_Bronze_Raw/master_data"       # Static master  master_data/{type}/
  templates:        "01_Bronze_Raw/templates"         # Audit + leadsheet templates

  # Payroll (AMC) — Monthly payroll reports + GL mapping
  payroll:
    raw:     "01_Bronze_Raw/payroll/amc/{year}"       # AMC Payroll report {mm}.{year}.csv
    mapping: "01_Bronze_Raw/payroll/amc/mapping"      # mapping_template.csv, map GL.csv

  # Specific key files (renamed 2026-07-01 — see FILE_NAMING.md)
  files:
    fbl3n:          "01_Bronze_Raw/gl/amc/gl_legacy.xlsx"
    leadsheet_q125: "01_Bronze_Raw/templates/leadsheet_q1_2025_stat.xlsx"
    leadsheet_q126: "01_Bronze_Raw/templates/leadsheet_q1_2026_stat.xlsx"
    leadsheet_q226: "01_Bronze_Raw/templates/leadsheet_q2_2026_stat.xlsx"
    leadsheet_ye25: "01_Bronze_Raw/templates/leadsheet_ye_2025.xlsx"
    tb_mar26:       "01_Bronze_Raw/inventory/amc/tb_nrv_202603_v9.xlsx"

# ---------------------------------------------------------------------------
# Silver Layer — Cleaned Parquet files (typed, validated, no nulls in keys)
# ---------------------------------------------------------------------------
silver:
  root:       "02_Silver_Cleaned"
  sales:      "02_Silver_Cleaned/master_sales_{year}.parquet"   # {year} = 2023/2024/2025/2026
  production: "02_Silver_Cleaned/master_production_{year}.parquet"
  # GL: ชื่อไฟล์ตามช่วงปี เช่น Master_GL_24_26.parquet — ใช้ wildcard Master_GL_*.parquet
  gl:         "02_Silver_Cleaned/Master_GL_*.parquet"
  ar:         "02_Silver_Cleaned/master_ar.parquet"
  ga_performance: "02_Silver_Cleaned/ga_performance_{year}.parquet"   # output of etl_ga_performance.py
  ga_production:  "02_Silver_Cleaned/ga_production_{year}.parquet"    # PRD metrics (yield, qty)

# ---------------------------------------------------------------------------
# Gold Layer — Business aggregates (dashboard-ready)
# ---------------------------------------------------------------------------
gold:
  root:       "03_Gold_DataMarts"
  # GL summary: ชื่อตามช่วงปีจริง เช่น Summary_GL_24_26.parquet — ใช้ wildcard
  gl_summary: "03_Gold_DataMarts/Summary_GL_*.parquet"

# ---------------------------------------------------------------------------
# Scripts & Outputs
# ---------------------------------------------------------------------------
scripts:
  leadsheet:  "06_Scripts/leadsheet"
  audit:      "06_Scripts/audit"
  reporting:  "06_Scripts/reporting"
  utils:      "06_Scripts/utils"
  output:     "06_Scripts/leadsheet/output"

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
database:
  duckdb: "finance_lake.duckdb"
  ops_db: "operations.db"

# ---------------------------------------------------------------------------
# API — Finance Data Lake REST API
# ---------------------------------------------------------------------------
api:
  local_url:    "http://localhost:8000"
  version:      "v1"
  prefix:       "/api/v1"
  docs:         "http://localhost:8000/docs"

  # Endpoints (relative to local_url + prefix)
  endpoints:
    health:            "/health"
    trial_balance:     "/financial/tb/{period}"     # period = YYYY-MM-DD
    master_tb:         "/financial/master-tb"
    leadsheet_build:   "/financial/leadsheet/build"
    gl_transactions:   "/gl/transactions"
    gl_balance:        "/gl/balance/{account}"
    ar_aging:          "/audit/ar-aging"
    sales_summary:     "/sales/summary/{year}"
    cost_closing:      "/cost-closing/zreport"
    fi_co_diff:        "/cost-closing/fi-co-diff"

# ---------------------------------------------------------------------------
# 07_Workspace — Finance Workspace scripts (migrated from _Finance workspace)
# ---------------------------------------------------------------------------
workspace:
  root:      "07_Workspace"
  reconcile: "07_Workspace/reconcile"
  cost:      "07_Workspace/cost"
  monthend:  "07_Workspace/monthend"
  analytics: "07_Workspace/analytics"
  utils:     "07_Workspace/utils"
  config:    "07_Workspace/config"
  working:   "07_Workspace/02_Working"

  # SAP raw data — Bronze paths post-reorganization (2026-07-01)
  # PRD_GI was split into domain folders:
  #   KSB1    → 01_Bronze_Raw/cost_center/amc/{plant}/{year}/
  #   MB51    → 01_Bronze_Raw/material_docs/amc/{plant}/{year}/
  #   PRD     → 01_Bronze_Raw/production_orders/amc/{plant}/{year}/
  #   AMC_GL  → 01_Bronze_Raw/gl/amc/{year}/
  #   AMC_TB  → 01_Bronze_Raw/tb_snapshots/amc/{year}/
  # Update workspace scripts to use domain paths above.

  # Google Drive (gspread — OAuth token in 07_Workspace/.credentials/)
  credentials: "07_Workspace/.credentials/token.json"
  google_scopes:
    - "https://www.googleapis.com/auth/spreadsheets"
    - "https://www.googleapis.com/auth/drive"

# ---------------------------------------------------------------------------
# External Projects that connect to this Data Lake
# ---------------------------------------------------------------------------
consumers:
  audit_reconcile:
    path: "../audit-reconcile"
    connection: "api"                 # reads via REST API
    config_file: "config.yaml"

  sap_cost_closing:
    path: "../sap_cost_closing_app"
    connection: "api"
    config_file: ".env"

  main_dashboard:
    path: "../main-dashboard"
    connection: "api"
    env_var: "NEXT_PUBLIC_DATA_LAKE_URL"

  fin_dashboard:
    path: "../fin-dashboard"
    connection: "api"
    env_var: "NEXT_PUBLIC_DATA_LAKE_URL"

  leadsheet:
    path: "06_Scripts/leadsheet"
    connection: "local"              # scripts run inside data lake
