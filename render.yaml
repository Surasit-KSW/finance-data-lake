services:
  - type: web
    name: finance-data-lake-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard
      - key: API_KEY
        sync: false   # set manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
